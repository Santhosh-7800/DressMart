<!doctype html>
<!--
  GitHub Pages is a static host with no server-side rewrites, so a direct link or refresh on any
  client-side route (e.g. /product/some-slug) 404s. This is the standard workaround
  (github.com/rafgraph/spa-github-pages): encode the intended path into a query string and
  redirect to the site root, where a small inline script in index.html decodes it back into a
  real URL via history.replaceState before React Router ever sees it.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>DressMart</title>
    <script>
      var segmentCount = 1; // number of path segments to treat as the base (the repo name)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + segmentCount).join('/') +
          '/?p=/' + l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
          (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
